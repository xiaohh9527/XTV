name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build XTV APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses 2>&1 | tail -5 || true
          sdkmanager "build-tools;37.0.0" "platforms;android-37" "platform-tools" 2>&1 | tail -30
          sdkmanager --list_installed | grep -E "37|36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup keystore (debug fallback)
        run: |
          keytool -genkeypair -keystore release.keystore -alias debugkey \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -keypass debug123 -storepass debug123 \
            -dname "CN=Android, OU=Android, O=Android, L=SZ, ST=GD, C=CN"
          ls -lh release.keystore

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=$GITHUB_WORKSPACE/release.keystore" >> local.properties
          echo "keyAlias=debugkey" >> local.properties
          echo "storePassword=debug123" >> local.properties
          echo "keyPassword=debug123" >> local.properties
          cat local.properties
          ls -lh release.keystore local.properties

      - name: Build APKs (Leanback + Mobile, arm64 + v7a)
        run: |
          chmod +x gradlew
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          ls -lh release.keystore local.properties
          cat local.properties
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "gradlew_exit:$rc"
          cat build.log | tail -300
          if [ $rc -ne 0 ]; then
            echo "BUILD FAILED, searching for error"
            grep -i -E "error|exception|failed|what went wrong|FAILED|STORE|KEYSTORE|SIGNING|Keystore" build.log | tail -150 || true
            exit $rc
          fi
          find app/build/outputs/apk -type f | head -20

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error

      - name: Rename APKs
        run: |
          mkdir -p Release/apk
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          find app/build/outputs/apk -name "*.apk" | while read f; do
            # app-leanback-arm64-v8a-debug.apk -> XTV-leanback-arm64-v8a.apk
            n=$(basename "$f" | sed 's/^app-//; s/-debug\.apk/.apk/')
            echo "$f -> Release/apk/XTV-$n"
            cp "$f" "Release/apk/XTV-$n"
          done
          ls -lh Release/apk/
          test -n "$(ls Release/apk/*.apk 2>/dev/null)" || (echo "NO APKs FOUND" && ls -R app/build/outputs/apk && exit 1)

      - name: 'Publish to GitHub Release (tag: latest)'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📺 小影视 (XTV) 安装包

          点击下方直接下载独立 `.apk` 文件：

          - 📺 **电视端 64位**：[XTV-leanbackArm64_v8a.apk](https://github.com/${{ github.repository }}/releases/download/latest/XTV-leanbackArm64_v8a.apk)
          - 📺 **电视端 32位**：[XTV-leanbackArmeabi_v7a.apk](https://github.com/${{ github.repository }}/releases/download/latest/XTV-leanbackArmeabi_v7a.apk)
          - 📱 **手机 64位**：[XTV-mobileArm64_v8a.apk](https://github.com/${{ github.repository }}/releases/download/latest/XTV-mobileArm64_v8a.apk)
          - 📱 **手机 32位**：[XTV-mobileArmeabi_v7a.apk](https://github.com/${{ github.repository }}/releases/download/latest/XTV-mobileArmeabi_v7a.apk)
          EOF
          ls -lh Release/apk/
          gh release delete latest --yes || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest Release/apk/*.apk \
            --title "小影视 (XTV) 最新安装包" \
            --notes-file release_notes.md

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XTV-APKs
          path: Release/apk/*.apk
          if-no-files-found: warn
